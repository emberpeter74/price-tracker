[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricetracker"
version = "0.1.0"
description = "Competitor price tracker - proof of concept"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
pricetracker = "pricetracker.cli:main"

[tool.setuptools]
packages = ["pricetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
